name: Validate and package BlueOS extension
on:
  push:
    branches: [main, codex/blueos-precision-landing, codex/precision-landing-review]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: precision-landing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e '.[vision,test]'
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -q --junitxml=test-results/python.xml
      - run: node --check src/wingxtra_pl/static/app.js
      - run: npm ci
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: python-test-results
          path: test-results
  containers:
    needs: python
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Test the Debian OpenCV runtime on this architecture
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: test
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Build installable image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: final
          platforms: linux/${{ matrix.arch }}
          build-args: VCS_REF=${{ github.sha }}
          load: true
          tags: wingxtra-pl:${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
      - name: Exercise container startup and health
        run: |
          docker run -d --name landing-test --network host --cap-drop ALL --security-opt no-new-privileges:true --cpus 2 --memory 1g --pids-limit 256 --volume "$RUNNER_TEMP/landing-data:/data" wingxtra-pl:${{ matrix.arch }}
          python3 tools/check_container.py
          docker logs landing-test
          docker stop landing-test
      - name: Export installable image archive
        run: docker save wingxtra-pl:${{ matrix.arch }} | gzip > wingxtra-pl-${{ matrix.arch }}.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blueos-image-${{ matrix.arch }}
          path: wingxtra-pl-${{ matrix.arch }}.tar.gz
          compression-level: 0
          retention-days: 30
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested candidate
        if: github.event_name != 'pull_request'
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}"
          docker tag wingxtra-pl:${{ matrix.arch }} "$IMAGE:sha-$COMMIT-${{ matrix.arch }}"
          docker push "$IMAGE:sha-$COMMIT-${{ matrix.arch }}"
  manifest:
    if: github.event_name != 'pull_request'
    needs: containers
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish combined architecture manifest
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}"
          docker buildx imagetools create --tag "$IMAGE:sha-$COMMIT" "$IMAGE:sha-$COMMIT-amd64" "$IMAGE:sha-$COMMIT-arm64"
