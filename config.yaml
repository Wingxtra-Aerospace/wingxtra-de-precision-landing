camera:
  index: 0
  width: 1280
  height: 720
  fps: 30

landing_target:
  layout_json: "landing-target.json"
  april_tag_family: "tag36h11"   # from your json
  opencv_dictionary: "DICT_APRILTAG_36h11"
  target_num: 0                  # from your json (also in file)

mavlink_out:
  # DroneEngage-first: send INTERNAL MAVLink via DroneEngage DataBus (single FC port, no serial contention)
  mode: "droneengage_databus"
  # The fields below are for Codex to wire to your actual DroneEngage databus config:
  databus_host: "127.0.0.1"
  databus_port: 60000

mavlink:
  send_hz: 10

frames:
  cam_to_body_rpy_deg: [0.0, 0.0, 0.0]
