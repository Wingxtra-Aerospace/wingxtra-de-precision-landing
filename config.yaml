# Schema version 1. Import with wingxtra-pl --config config.yaml
schema_version: 1
camera:
  kind: rtsp
  source: rtsp://127.0.0.1:8554/landing
  camera_id: landing-camera
  lens_profile: fixed-focus
  width: 1280
  height: 720
  fps: 30
mount:
  camera_to_body:
  - - 0
    - -1
    - 0
  - - 1
    - 0
    - 0
  - - 0
    - 0
    - 1
output:
  mode: udp
  listen_host: 127.0.0.1
  listen_port: 14771
  peer_host: 127.0.0.1
  target_system: 1
  source_component: 193
  heartbeat_timeout_s: 3.0
  send_hz: 20
  databus_host: 127.0.0.1
  databus_port: 60000
  databus_module_key: wingxtra-precision-landing
quality:
  max_frame_age_s: 0.25
  max_reprojection_px: 3
  min_tag_edge_px: 12
  min_tags: 1
  min_distance_m: 0.1
  max_distance_m: 30
  reacquire_frames: 3
  max_relative_speed_m_s: 6
  jump_allowance_m: 0.15
  track_reset_s: 0.5
startup_mode: stopped
