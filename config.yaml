camera:
  index: 0
  width: 1280
  height: 720
  fps: 30

landing_target:
  layout_json: landing-target.json
  april_tag_family: tag36h11
  opencv_dictionary: DICT_APRILTAG_36h11
  target_num: 0

mavlink_out:
  # DroneEngage-first: send INTERNAL MAVLink via DroneEngage DataBus
  # (single FC port, no serial contention)
  mode: droneengage_databus
  # sendBMSG metadata command for internal MAVLink payload (configurable)
  internal_mavlink_cmd: m
  # Wire these to your DroneEngage DataBus config:
  databus_host: 127.0.0.1
  # Must be set per deployment (CLI/env/config). Keep null in repository defaults.
  databus_port: null
  # Optional candidate ports for --databus-sniff probing.
  databus_candidate_ports: []

mavlink:
  send_hz: 10

stability:
  # Reject pose when reprojection RMSE exceeds threshold.
  max_reproj_rmse_px: 8.0
  # EMA smoothing factor in [0,1], higher = more responsive.
  ema_alpha: 0.4
  # Reset tracking state when target unseen beyond timeout.
  stale_timeout_ms: 1000

frames:
  cam_to_body_rpy_deg: [0.0, 0.0, 0.0]
