[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "wingxtra-precision-landing"
version = "1.0.0rc1"
description = "Calibrated multi-tag landing target service and BlueOS extension"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["numpy>=1.24,<3", "PyYAML==6.0.3", "pymavlink==2.4.49", "fastapi==0.135.1", "uvicorn==0.41.0", "pydantic==2.12.5"]

[project.optional-dependencies]
vision = ["opencv-contrib-python-headless==4.13.0.92"]
test = ["pytest==9.0.2", "httpx==0.28.1", "ruff==0.15.5"]

[project.scripts]
wingxtra-pl = "wingxtra_pl.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wingxtra_pl = ["static/*", "defaults/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
